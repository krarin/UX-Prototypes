<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DigitalQA Doc Center V7</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Roboto', 'sans-serif'] },
          colors: {
            primary: { 100: '#E6F5F3', 500: '#009688', 600: '#00877A', 700: '#00695c' },
            neutral: {
              50: '#FAFAFA', 100: '#F5F5F5', 200: '#EEEEEE', 300: '#E0E0E0',
              400: '#BDBDBD', 500: '#9E9E9E', 600: '#757575', 700: '#616161',
              800: '#424242', 900: '#212121',
            },
            'qa-pass':        '#20BF6B',
            'qa-pass-light':  '#E9FCF2',
            'qa-fail':        '#FF5656',
            'qa-fail-light':  '#FFEEEE',
            'qa-warn':        '#FF9F1A',
            'qa-warn-light':  '#FFF5E8',
          }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; font-family: 'Roboto', sans-serif; background: #ECEFF1; }
    .icon {
      font-family: 'Material Symbols Outlined'; font-style: normal;
      font-size: 20px; line-height: 1;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
      user-select: none;
    }
    .icon-filled { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 20; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">

/* ─── Shared primitives ─────────────────────────────────────────── */

function Icon({ name, size = 20, fill = false, className = '', style = {} }) {
  return (
    <span
      className={`icon ${fill ? 'icon-filled' : ''} ${className}`}
      style={{ fontSize: size, ...style }}
    >
      {name}
    </span>
  );
}

function QAChip({ status }) {
  if (status === 'pass') return (
    <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[11px] font-medium bg-qa-pass-light text-qa-pass whitespace-nowrap">
      <Icon name="check_circle" size={12} fill className="text-qa-pass" />
      Bestanden
    </span>
  );
  if (status === 'fail') return (
    <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[11px] font-medium bg-qa-fail-light text-qa-fail whitespace-nowrap">
      <Icon name="cancel" size={12} fill className="text-qa-fail" />
      Nicht erfüllt
    </span>
  );
  if (status === 'pending') return (
    <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[11px] font-medium bg-neutral-100 text-neutral-500 whitespace-nowrap">
      <Icon name="hourglass_empty" size={12} className="text-neutral-400" />
      Wird geprüft…
    </span>
  );
  return null;
}

function VersionBadge({ version, active }) {
  return (
    <span className={`inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold leading-none
      ${active ? 'bg-primary-500 text-white' : 'bg-neutral-200 text-neutral-600'}`}>
      V{version}
    </span>
  );
}

function DocStatusIcon({ status }) {
  if (status === 'ok') return <Icon name="check_circle" size={18} fill className="text-qa-pass flex-shrink-0" />;
  if (status === 'fail') return <Icon name="cancel" size={18} fill className="text-qa-fail flex-shrink-0" />;
  if (status === 'pending') return (
    <span className="w-[18px] h-[18px] rounded-full bg-neutral-400 inline-flex items-center justify-center flex-shrink-0">
      <Icon name="hourglass_empty" size={11} className="text-white" />
    </span>
  );
  if (status === 'archived') return <Icon name="archive" size={18} className="text-neutral-400 flex-shrink-0" />;
  return null;
}

function UploaderRow({ initials, name, date }) {
  return (
    <div className="flex items-center gap-2">
      <span className="w-6 h-6 rounded-full bg-neutral-200 inline-flex items-center justify-center flex-shrink-0 text-[10px] font-bold text-neutral-600">
        {initials}
      </span>
      <span className="text-[12px] text-neutral-500">{name}</span>
      <span className="text-[11px] text-neutral-400">·</span>
      <span className="text-[11px] text-neutral-400 tabular-nums">{date}</span>
    </div>
  );
}

/* ─── Pattern A: Versioned Document Slot (Timeline Model) ───────── */

const VERSIONS = [
  {
    version: 2,
    uploadDate: '28. Jun. 2026, 09:15',
    uploadedBy: 'Melissa Mustermann',
    initials: 'MM',
    status: 'ok',
    qaChecks: [
      { id: 'a1', name: 'Lesbarkeit',  status: 'pass', result: 'Lesbarkeit bestätigt' },
      { id: 'a2', name: 'Aktualität',  status: 'pass', result: 'Datum: 15.06.2026 – aktuell' },
    ]
  },
  {
    version: 1,
    uploadDate: '05. Mär. 2026, 14:32',
    uploadedBy: 'Melissa Mustermann',
    initials: 'MM',
    status: 'archived',
    supersededOn: '28. Jun. 2026, 09:18',
    supersededReason: 'Durch neue Version ersetzt',
    qaChecks: [
      { id: 'b1', name: 'Lesbarkeit',  status: 'fail', result: 'Dokument unleserlich – bitte erneut scannen' },
      { id: 'b2', name: 'Aktualität',  status: 'fail', result: 'Exposé veraltet (älter als 3 Monate)' },
    ]
  }
];

function VersionCard({ v, defaultOpen = false }) {
  const [open, setOpen] = React.useState(defaultOpen);
  const isActive = v.status === 'ok';
  const isArchived = v.status === 'archived';

  return (
    <div className={`rounded-lg border overflow-hidden ${isActive ? 'border-primary-500/30 bg-white' : 'border-neutral-200 bg-neutral-50'}`}>
      {/* Version row header */}
      <button
        onClick={() => setOpen(x => !x)}
        className="w-full flex items-center gap-3 px-4 py-3 text-left hover:bg-neutral-50 transition-colors"
      >
        <VersionBadge version={v.version} active={isActive} />

        <div className="flex-1 min-w-0 flex flex-col gap-0.5">
          <div className="flex items-center gap-2">
            <span className={`text-[13px] font-medium ${isArchived ? 'text-neutral-500' : 'text-neutral-900'}`}>
              {isActive ? 'Aktuelle Version' : 'Archiviert'}
            </span>
            {isActive && (
              <span className="inline-flex items-center gap-0.5 px-1.5 py-0.5 rounded-full text-[10px] font-medium bg-qa-pass-light text-qa-pass">
                <Icon name="check_circle" size={10} fill /> Prüfung bestanden
              </span>
            )}
            {isArchived && (
              <span className="text-[11px] text-neutral-400 italic">{v.supersededReason}</span>
            )}
          </div>
          <UploaderRow initials={v.initials} name={v.uploadedBy} date={v.uploadDate} />
        </div>

        <DocStatusIcon status={v.status} />
        <Icon
          name={open ? 'expand_less' : 'expand_more'}
          size={18}
          className="text-neutral-400 flex-shrink-0"
        />
      </button>

      {/* Expanded QA checks */}
      {open && (
        <div className={`border-t ${isArchived ? 'border-neutral-200' : 'border-neutral-100'} px-4 py-3 flex flex-col gap-2`}>
          <span className="text-[11px] font-medium text-neutral-500 uppercase tracking-wide">
            QA-Prüfungen {isArchived ? `(Ergebnis vom ${v.uploadDate})` : ''}
          </span>
          {v.qaChecks.map(c => (
            <div key={c.id} className="flex items-center gap-3">
              <QAChip status={c.status} />
              <span className={`text-[12px] ${c.status === 'fail' ? 'text-neutral-700 font-medium' : 'text-neutral-500'}`}>
                {c.status === 'fail' ? c.result : c.name}
              </span>
            </div>
          ))}
          {isArchived && (
            <div className="mt-1 pt-2 border-t border-neutral-200 flex items-center gap-2 text-[11px] text-neutral-400">
              <Icon name="archive" size={13} />
              Archiviert am {v.supersededOn} · Version nicht mehr aktiv
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function PatternA() {
  return (
    <div className="flex flex-col gap-4">
      {/* Doc slot header */}
      <div className="bg-white rounded-lg border border-neutral-200 overflow-hidden">
        <div className="flex items-center gap-3 px-4 py-3 border-b border-neutral-100">
          <DocStatusIcon status="ok" />
          <span className="flex-1 text-[13px] font-medium text-neutral-900">Exposé</span>
          <span className="text-[11px] text-neutral-400">2 Versionen</span>
          <button className="w-7 h-7 flex items-center justify-center rounded hover:bg-neutral-100 text-neutral-400 hover:text-neutral-600 transition-colors">
            <Icon name="more_horiz" size={18} />
          </button>
        </div>

        {/* Version stack */}
        <div className="flex flex-col gap-2 p-3">
          {VERSIONS.map(v => (
            <VersionCard key={v.version} v={v} defaultOpen={v.version === 2} />
          ))}
        </div>
      </div>

      {/* Annotation */}
      <div className="bg-primary-100 border border-primary-500/20 rounded-lg px-4 py-3 text-[12px] text-primary-700 leading-relaxed">
        <span className="font-medium">Wie es funktioniert:</span> Jeder Upload erzeugt eine neue Version im selben Slot.
        Die aktuelle Version ist immer oben sichtbar. Ältere Versionen werden archiviert und können jederzeit aufgeklappt werden,
        inkl. der QA-Ergebnisse zum Zeitpunkt des Uploads.
      </div>
    </div>
  );
}

/* ─── Pattern B: Replace-and-Confirm Workflow ───────────────────── */

const PATTERN_B_STATES = { INCOMING: 'incoming', CONFIRMED: 'confirmed', HISTORY: 'history' };

function PatternB() {
  const [state, setState] = React.useState(PATTERN_B_STATES.INCOMING);
  const [qaRunning, setQaRunning] = React.useState(false);
  const [newChecks, setNewChecks] = React.useState([
    { id: 'n1', name: 'Lesbarkeit', status: 'pending', result: '–' },
    { id: 'n2', name: 'Aktualität', status: 'pending', result: '–' },
  ]);
  const timerRef = React.useRef(null);

  function handleConfirm() {
    setState(PATTERN_B_STATES.CONFIRMED);
    setQaRunning(true);
    timerRef.current = setTimeout(() => {
      setNewChecks([
        { id: 'n1', name: 'Lesbarkeit', status: 'pass', result: 'Lesbarkeit bestätigt' },
        { id: 'n2', name: 'Aktualität', status: 'pass', result: 'Datum: 15.06.2026 – aktuell' },
      ]);
      setQaRunning(false);
    }, 2200);
  }

  function handleReset() {
    clearTimeout(timerRef.current);
    setState(PATTERN_B_STATES.INCOMING);
    setQaRunning(false);
    setNewChecks([
      { id: 'n1', name: 'Lesbarkeit', status: 'pending', result: '–' },
      { id: 'n2', name: 'Aktualität', status: 'pending', result: '–' },
    ]);
  }

  const allPass = newChecks.every(c => c.status === 'pass');
  const historyOpen = state === PATTERN_B_STATES.HISTORY;

  return (
    <div className="flex flex-col gap-4">

      {/* ── State: INCOMING ── */}
      {state === PATTERN_B_STATES.INCOMING && (
        <div className="bg-white rounded-lg border border-neutral-200 overflow-hidden">
          {/* Slot header with banner */}
          <div className="flex items-center gap-3 px-4 py-3 border-b border-neutral-100 bg-qa-warn-light">
            <Icon name="upload_file" size={18} className="text-qa-warn flex-shrink-0" style={{ fontVariationSettings: "'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 20" }} />
            <div className="flex-1 min-w-0">
              <span className="text-[13px] font-medium text-neutral-900">Exposé</span>
              <span className="ml-2 inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-medium bg-qa-warn text-white">
                Neue Version eingegangen
              </span>
            </div>
          </div>

          {/* Side-by-side comparison */}
          <div className="grid grid-cols-2 gap-3 p-3">
            {/* Current (flagged) */}
            <div className="flex flex-col gap-2 p-3 rounded-lg border border-qa-fail/30 bg-qa-fail-light/30">
              <div className="flex items-center justify-between">
                <span className="text-[11px] font-medium text-neutral-500 uppercase tracking-wide">Aktuell</span>
                <span className="inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[10px] font-medium bg-qa-fail text-white">
                  <Icon name="cancel" size={10} fill /> Abgelehnt
                </span>
              </div>
              <UploaderRow initials="MM" name="Melissa M." date="05. Mär. 2026" />
              <div className="flex flex-col gap-1.5 mt-1">
                <div className="flex items-center gap-2"><QAChip status="fail" /><span className="text-[11px] text-neutral-600">Dokument unleserlich</span></div>
                <div className="flex items-center gap-2"><QAChip status="fail" /><span className="text-[11px] text-neutral-600">Exposé veraltet (&gt; 3 Mon.)</span></div>
              </div>
            </div>

            {/* Incoming (new) */}
            <div className="flex flex-col gap-2 p-3 rounded-lg border border-primary-500/30 bg-primary-100/50">
              <div className="flex items-center justify-between">
                <span className="text-[11px] font-medium text-neutral-500 uppercase tracking-wide">Eingehend</span>
                <span className="inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[10px] font-medium bg-primary-500 text-white">
                  <Icon name="upload" size={10} /> Neu
                </span>
              </div>
              <UploaderRow initials="MM" name="Melissa M." date="28. Jun. 2026" />
              <p className="text-[11px] text-neutral-400 italic mt-1">QA-Prüfung startet nach Bestätigung.</p>
            </div>
          </div>

          {/* Action row */}
          <div className="flex items-center gap-3 px-4 pb-4">
            <button
              onClick={handleConfirm}
              className="flex items-center gap-2 h-9 px-4 rounded bg-primary-500 text-white text-[13px] font-medium hover:bg-primary-600 transition-colors"
            >
              <Icon name="swap_horiz" size={16} className="text-white" />
              Neue Version bestätigen
            </button>
            <button className="text-[13px] text-neutral-500 hover:text-neutral-700 transition-colors">
              Abbrechen
            </button>
          </div>
        </div>
      )}

      {/* ── State: CONFIRMED ── */}
      {state !== PATTERN_B_STATES.INCOMING && (
        <div className="bg-white rounded-lg border border-neutral-200 overflow-hidden">
          {/* Clean slot header */}
          <div className="flex items-center gap-3 px-4 py-3 border-b border-neutral-100">
            <DocStatusIcon status={allPass ? 'ok' : 'pending'} />
            <span className="flex-1 text-[13px] font-medium text-neutral-900">Exposé</span>
            <button
              onClick={() => setState(s => s === PATTERN_B_STATES.HISTORY ? PATTERN_B_STATES.CONFIRMED : PATTERN_B_STATES.HISTORY)}
              className="flex items-center gap-1 text-[11px] text-neutral-400 hover:text-primary-600 transition-colors"
            >
              <Icon name="history" size={14} />
              1 frühere Version
            </button>
            <button className="w-7 h-7 flex items-center justify-center rounded hover:bg-neutral-100 text-neutral-400 hover:text-neutral-600 transition-colors">
              <Icon name="more_horiz" size={18} />
            </button>
          </div>

          {/* Current version info */}
          <div className="px-4 py-3 flex flex-col gap-2">
            <UploaderRow initials="MM" name="Melissa Mustermann" date="28. Jun. 2026, 09:15" />

            {/* QA checks — running or done */}
            <div className="flex flex-col gap-1.5 mt-1">
              {qaRunning ? (
                <div className="flex items-center gap-2 text-[12px] text-neutral-500">
                  <Icon name="progress_activity" size={14} className="text-primary-500 animate-spin" />
                  QA-Prüfung läuft…
                </div>
              ) : (
                newChecks.map(c => (
                  <div key={c.id} className="flex items-center gap-3">
                    <QAChip status={c.status} />
                    <span className="text-[12px] text-neutral-500">
                      {c.status === 'pass' ? c.result : c.name}
                    </span>
                  </div>
                ))
              )}
            </div>
          </div>

          {/* History section — collapsed by default */}
          {historyOpen && (
            <div className="border-t border-neutral-100 px-4 py-3 bg-neutral-50 flex flex-col gap-2">
              <span className="text-[11px] font-medium text-neutral-400 uppercase tracking-wide">Frühere Version</span>
              <div className="rounded-lg border border-neutral-200 bg-white overflow-hidden">
                <div className="flex items-center gap-3 px-3 py-2.5">
                  <DocStatusIcon status="archived" />
                  <div className="flex-1 flex flex-col gap-0.5">
                    <div className="flex items-center gap-2">
                      <span className="text-[12px] text-neutral-500">Version 1</span>
                      <span className="text-[11px] italic text-neutral-400">Ersetzt am 28. Jun. 2026, 09:18</span>
                    </div>
                    <UploaderRow initials="MM" name="Melissa M." date="05. Mär. 2026, 14:32" />
                  </div>
                </div>
                <div className="border-t border-neutral-100 px-3 py-2.5 flex flex-col gap-1.5">
                  <div className="flex items-center gap-3"><QAChip status="fail" /><span className="text-[12px] text-neutral-600">Dokument unleserlich – bitte erneut scannen</span></div>
                  <div className="flex items-center gap-3"><QAChip status="fail" /><span className="text-[12px] text-neutral-600">Exposé veraltet (älter als 3 Monate)</span></div>
                </div>
              </div>
            </div>
          )}
        </div>
      )}

      {/* Annotation */}
      <div className="bg-primary-100 border border-primary-500/20 rounded-lg px-4 py-3 text-[12px] text-primary-700 leading-relaxed">
        <span className="font-medium">Wie es funktioniert:</span> Geht eine neue Datei ein, erscheint ein Vergleich zwischen der
        aktuellen (abgelehnten) und der eingehenden Version. Nach Bestätigung startet die QA-Prüfung sofort.
        Die alte Version bleibt über „Frühere Version" abrufbar, inklusive der originalen QA-Ergebnisse.
      </div>

      {/* Demo reset */}
      <button
        onClick={handleReset}
        className="self-start flex items-center gap-1.5 text-[11px] text-neutral-400 hover:text-neutral-600 transition-colors"
      >
        <Icon name="replay" size={13} />
        Demo zurücksetzen
      </button>
    </div>
  );
}

/* ─── Page shell ─────────────────────────────────────────────────── */

function App() {
  return (
    <div className="min-h-screen bg-[#ECEFF1] flex flex-col">

      {/* Top bar */}
      <div className="bg-white border-b border-neutral-200 px-6 py-3 flex items-center gap-3 flex-shrink-0">
        <span className="text-[13px] font-medium text-neutral-900">DigitalQA Doc Center</span>
        <span className="text-neutral-300">/</span>
        <span className="text-[13px] text-neutral-500">V7 – Upload Additional Document Flow</span>
        <span className="ml-auto inline-flex items-center gap-1.5 px-2 py-1 rounded bg-neutral-100 text-[11px] text-neutral-500">
          <Icon name="science" size={12} />
          Prototype · 2 patterns
        </span>
      </div>

      {/* Context banner */}
      <div className="mx-6 mt-5 bg-white border border-neutral-200 rounded-lg px-5 py-4 flex items-start gap-4">
        <div className="w-9 h-9 rounded-full bg-qa-fail-light flex items-center justify-center flex-shrink-0 mt-0.5">
          <Icon name="cancel" size={20} fill className="text-qa-fail" />
        </div>
        <div className="flex flex-col gap-1">
          <span className="text-[14px] font-medium text-neutral-900">Szenario: Exposé — Neues Dokument nach Ablehnung</span>
          <p className="text-[13px] text-neutral-500 leading-relaxed max-w-3xl">
            Das Exposé wurde vom Kunden hochgeladen, aber von der QA abgelehnt: das Dokument ist unleserlich und älter als 3 Monate.
            Der Berater hat eine Neuanforderung gestellt. Der Kunde hat jetzt ein neues Exposé hochgeladen.
            Unten sind zwei UX-Muster für den Umgang mit diesem Ersatz-Upload.
          </p>
        </div>
      </div>

      {/* Two-column layout */}
      <div className="flex-1 p-6 grid grid-cols-2 gap-6 items-start">

        {/* Pattern A */}
        <div className="flex flex-col gap-3">
          <div className="flex items-center gap-3">
            <span className="w-6 h-6 rounded-full bg-neutral-800 text-white text-[11px] font-bold flex items-center justify-center flex-shrink-0">A</span>
            <div>
              <p className="text-[14px] font-medium text-neutral-900">Versionierter Dokument-Slot</p>
              <p className="text-[12px] text-neutral-500">Versionshistorie immer sichtbar im Slot · kein expliziter Bestätigungsschritt</p>
            </div>
          </div>
          <PatternA />
        </div>

        {/* Pattern B */}
        <div className="flex flex-col gap-3">
          <div className="flex items-center gap-3">
            <span className="w-6 h-6 rounded-full bg-neutral-800 text-white text-[11px] font-bold flex items-center justify-center flex-shrink-0">B</span>
            <div>
              <p className="text-[14px] font-medium text-neutral-900">Ersetzen mit Bestätigung</p>
              <p className="text-[12px] text-neutral-500">Expliziter Vergleich vor dem Ersetzen · Slot zeigt nur aktuelle Version</p>
            </div>
          </div>
          <PatternB />
        </div>

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
