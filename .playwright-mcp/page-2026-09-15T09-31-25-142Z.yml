  - generic [ref=e596]:
    - text: Anmerkungen zum Prototyp
    - list [ref=e597]:
      - listitem [ref=e598]: 1 Das Merken-Symbol (Lesezeichen) sitzt rechts bei den übrigen Aktionen und setzt die Merkliste. Die Zeile wandert in die gemerkte Gruppe, der Zähler im Gruppenkopf zählt live mit.
      - listitem [ref=e599]: 2 Die Vergleichsaktion sitzt im Kopf der gemerkten Gruppe — kein zusätzliches Control in der Zeile.
      - listitem [ref=e600]: 3 0 gemerkt → Gruppe gar nicht da. 1 → Aktion sichtbar, aber inaktiv. 2–3 → „Diese n vergleichen“. 4+ → „Vergleichen (max. 3)“, die ersten drei sind vorausgewählt.
      - listitem [ref=e601]: 4 Suche und Machbarkeits-Schalter greifen nur in „Alle Angebote“; die Merkliste bleibt vollständig. Zu bestätigen.
      - listitem [ref=e602]: 5 Die Auswahlliste tauscht Angebote direkt auf der Vergleichsseite. Esc klappt sie zu.
      - listitem [ref=e603]: 6 Bei drei gewählten Angeboten werden die übrigen Zeilen gesperrt — mit sichtbarem Grund, nie als stumme Checkbox.
      - listitem [ref=e604]: 7 Ein gemeinsamer Chart. Achsen 0–480.000 € und 0–30 Jahre stehen fest, damit die Auswahl den Maßstab nie verschiebt.
      - listitem [ref=e605]: 8 Der Spaltenkopf trägt die Farbe der Linie im Chart. Das „×“ nimmt die Spalte aus dem Vergleich.
      - listitem [ref=e606]: 9 Bester Wert je Zeile mit ▲ und Haarlinie — übersteht Schwarz-Weiß-Druck und Farbsehschwäche.
      - listitem [ref=e607]: 10 Optionen rechnen Laufzeit, Gesamtaufwand und die gestrichelte Kurve neu.
      - listitem [ref=e608]: 11 Bei weniger als drei Angeboten steht eine gestrichelte Platzhalterspalte; ein Klick öffnet die Auswahlliste.
      - listitem [ref=e609]: 12 „Zurück zur Liste“ erhält Merkliste und Auswahl.